<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" style="background:#030712; border-radius:10px;">
  <defs>
    <linearGradient id="hackBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050b18"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Terminal Frame -->
  <rect width="960" height="300" rx="10" fill="url(#hackBg)" stroke="#00ff9d" stroke-width="1" opacity="0.9"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="960" height="34" rx="10" fill="#0b172a"/>
  <rect x="0" y="24" width="960" height="10" fill="#0b172a"/>
  <line x1="0" y1="34" x2="960" y2="34" stroke="#00ff9d" stroke-width="0.8" opacity="0.4"/>

  <!-- Window Dots -->
  <circle cx="20" cy="17" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="17" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="17" r="5" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="480" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#00ff9d" letter-spacing="1">
    ⚡ LIVE CYBER EXPLOITATION &amp; DEFENSE SIMULATOR v2.4
  </text>

  <!-- MATRIX RAIN BACKGROUND STREAMS -->
  <g font-family="'JetBrains Mono', monospace" font-size="10" fill="#00ff9d" opacity="0.12">
    <text x="50" y="0">01001000 01100001 01100011 01101011
      <animate attributeName="y" values="-20;320" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="250" y="0">01010011 01000101 01000011 01010101
      <animate attributeName="y" values="-40;320" dur="5s" begin="1s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="0">01010010 01001111 01001111 01010100
      <animate attributeName="y" values="-10;320" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
    </text>
    <text x="650" y="0">01010000 01010111 01001110 01000101
      <animate attributeName="y" values="-30;320" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="800" y="0">01000001 01000101 01000011 00110010
      <animate attributeName="y" values="-50;320" dur="5.5s" begin="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- LIVE HACKING TERMINAL EXECUTION SEQUENCE -->
  <g transform="translate(30, 65)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12">

    <!-- Step 1 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.2s" fill="freeze"/>
      <text x="0" y="0" fill="#00f0ff" font-weight="bold">loki@sec-ops:~$ <tspan fill="#ffffff">python3 exploit_payload.py --target="192.168.1.0/24" --mode="stealth"</tspan></text>
    </g>

    <!-- Step 2 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.2s" fill="freeze"/>
      <text x="0" y="24" fill="#00ff9d">[+] Scanning ports... <tspan fill="#38bdf8">[PORT 22, 80, 443, 8080 OPEN]</tspan></text>
    </g>

    <!-- Step 3 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.2s" fill="freeze"/>
      <text x="0" y="48" fill="#00ff9d">[+] Probing web target... <tspan fill="#f59e0b">[WAF DETECTED: CLOUDFLARE]</tspan></text>
    </g>

    <!-- Step 4 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.2s" fill="freeze"/>
      <text x="0" y="72" fill="#00ff9d">[+] Executing bypass payload... <tspan fill="#00ff9d" font-weight="bold" filter="url(#greenGlow)">[BYPASS SUCCESSFUL ✔]</tspan></text>
    </g>

    <!-- Step 5 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.2s" fill="freeze"/>
      <text x="0" y="96" fill="#a855f7">[+] Escalating privileges to root... <tspan fill="#a855f7" font-weight="bold">[UID=0(root) GID=0(root)]</tspan></text>
    </g>

    <!-- Step 6 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="4.2s" dur="0.2s" fill="freeze"/>
      <text x="0" y="120" fill="#00f0ff"># whoami -&gt; <tspan fill="#00ff9d" font-weight="bold" filter="url(#greenGlow)">root@cyber-matrix</tspan></text>
    </g>

    <!-- Step 7 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="5.0s" dur="0.2s" fill="freeze"/>
      <text x="0" y="144" fill="#00ff9d">[✔] Vulnerability Assessment &amp; Remediation Complete. System Hardened.</text>
    </g>

    <!-- Terminal Prompt with Blinking Cursor -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="5.8s" dur="0.1s" fill="freeze"/>
      <text x="0" y="172" fill="#00ff9d">root@sec-ops:~# <tspan fill="#ffffff">system_status --monitor</tspan></text>

      <rect x="250" y="160" width="8" height="15" fill="#00ff9d" filter="url(#greenGlow)">
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      </rect>
    </g>

  </g>

  <!-- Bottom Line Status -->
  <line x1="20" y1="270" x2="940" y2="270" stroke="#00ff9d" stroke-width="0.5" opacity="0.3"/>
  <text x="30" y="285" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00ff9d" opacity="0.8">[SESSION: ENCRYPTED]</text>
  <text x="930" y="285" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff" opacity="0.8">[LOGS: AUDITED]</text>
</svg>
