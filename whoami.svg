<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" style="background:transparent; border-radius:10px;">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.2"/>
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="10" y="10" width="940" height="400" rx="10" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Top Window Title Bar -->
  <path d="M 10,20 A 10,10 0 0 1 20,10 L 940,10 A 10,10 0 0 1 950,20 L 950,46 L 10,46 Z" fill="url(#headerGrad)"/>
  <line x1="10" y1="46" x2="950" y2="46" stroke="#334155" stroke-width="1"/>

  <!-- macOS Control Buttons -->
  <circle cx="32" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="28" r="6" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="480" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#94a3b8">
    loki@sec-ops: ~/whoami.sh
  </text>

  <!-- Terminal Content Container -->
  <g transform="translate(35, 75)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13">
    
    <!-- Command Prompt Line -->
    <text x="0" y="0" fill="#00ff9d" font-weight="bold">
      ┌──(loki㉿sec-ops)-[~/profile]
    </text>
    <text x="0" y="22" fill="#00ff9d" font-weight="bold">
      └─$ <tspan fill="#ffffff">./whoami.sh --verbose</tspan>
    </text>

    <!-- Separator Line -->
    <line x1="0" y1="36" x2="890" y2="36" stroke="#00f0ff" stroke-width="0.5" opacity="0.3"/>

    <!-- Profile Key-Values -->
    <g transform="translate(10, 65)">
      <!-- Line 1: Identity -->
      <g>
        <text x="0" y="0" fill="#00f0ff" font-weight="bold">IDENTITY    :</text>
        <text x="140" y="0" fill="#f8fafc" font-weight="bold">Logeshwaran S <tspan fill="#64748b">(Alias: Loki)</tspan></text>
      </g>

      <!-- Line 2: Role -->
      <g transform="translate(0, 26)">
        <text x="0" y="0" fill="#00f0ff" font-weight="bold">ROLE        :</text>
        <text x="140" y="0" fill="#38bdf8" font-weight="bold">Security Analyst &amp; Penetration Tester</text>
      </g>

      <!-- Line 3: Specialization -->
      <g transform="translate(0, 52)">
        <text x="0" y="0" fill="#00f0ff" font-weight="bold">DOMAINS     :</text>
        <text x="140" y="0" fill="#e2e8f0">SOC Ops · VAPT · Web/Network Pentesting · Threat Hunting</text>
      </g>

      <!-- Line 4: Acknowledgements -->
      <g transform="translate(0, 78)">
        <text x="0" y="0" fill="#00f0ff" font-weight="bold">RECOGNITION :</text>
        <text x="140" y="0" fill="#00ff9d" font-weight="bold">Google Android VRP <tspan fill="#94a3b8">·</tspan> NVIDIA PSIRT <tspan fill="#94a3b8">·</tspan> CERT-In Acknowledgements</text>
      </g>

      <!-- Line 5: Location -->
      <g transform="translate(0, 104)">
        <text x="0" y="0" fill="#00f0ff" font-weight="bold">LOCATION    :</text>
        <text x="140" y="0" fill="#f8fafc">Tamil Nadu, India 🇮🇳</text>
      </g>

      <!-- Line 6: Philosophy -->
      <g transform="translate(0, 130)">
        <text x="0" y="0" fill="#00f0ff" font-weight="bold">MOTTO       :</text>
        <text x="140" y="0" fill="#a855f7" font-style="italic">"The quieter you become, the more you can hear."</text>
      </g>

      <!-- Line 7: Status -->
      <g transform="translate(0, 156)">
        <text x="0" y="0" fill="#00f0ff" font-weight="bold">AVAILABILITY:</text>
        <text x="140" y="0" fill="#00ff9d" font-weight="bold" filter="url(#glowGreen)">● OPEN FOR OPPORTUNITIES <tspan fill="#cbd5e1" font-weight="normal">(Security Analyst / Penetration Testing Roles)</tspan></text>
      </g>
    </g>

    <!-- Bottom Shell Execution Status -->
    <g transform="translate(0, 260)">
      <line x1="0" y1="0" x2="890" y2="0" stroke="#00f0ff" stroke-width="0.5" opacity="0.3"/>
      <text x="0" y="24" fill="#00ff9d">[✔] Environment Ready. Cyber Defense Operating Normally.</text>
      <text x="0" y="46" fill="#38bdf8">loki@sec-ops:~$ <tspan fill="#ffffff">awaiting_connection...</tspan></text>

      <!-- Blinking Cursor -->
      <rect x="235" y="34" width="8" height="15" fill="#00ff9d" filter="url(#glowGreen)">
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
