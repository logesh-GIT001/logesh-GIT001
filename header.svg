<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" style="background:#030712; border-radius:12px;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="40%" stop-color="#0b1329"/>
      <stop offset="70%" stop-color="#110d29"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Neon Lines Gradient -->
    <linearGradient id="cyanPurpleLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#7000ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="360" rx="12" fill="url(#bgGrad)"/>

  <!-- Matrix Grid Pattern -->
  <g opacity="0.07" stroke="#00f0ff" stroke-width="0.5">
    <line x1="0" y1="40" x2="1000" y2="40"/>
    <line x1="0" y1="80" x2="1000" y2="80"/>
    <line x1="0" y1="120" x2="1000" y2="120"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="0" y1="280" x2="1000" y2="280"/>
    <line x1="0" y1="320" x2="1000" y2="320"/>

    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
  </g>

  <!-- Floating Star Particles -->
  <g>
    <circle cx="150" cy="70" r="1.5" fill="#00f0ff" opacity="0.6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="90" r="2" fill="#7000ff" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="290" r="1.2" fill="#00ff9d" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="270" r="1.8" fill="#ff0055" opacity="0.6">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- CYBER RADAR ARRAY (Full Sweep + Pulsing Waves) -->
  <g transform="translate(500, 150)">
    <circle cx="0" cy="0" r="125" fill="none" stroke="#00f0ff" stroke-width="0.6" opacity="0.2"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#7000ff" stroke-width="0.6" opacity="0.25"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#00f0ff" stroke-width="0.6" opacity="0.3"/>

    <!-- Pulsing Radar Pulse Wave 1 -->
    <circle cx="0" cy="0" r="0" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0">
      <animate attributeName="r" values="0;125" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Pulsing Radar Pulse Wave 2 -->
    <circle cx="0" cy="0" r="0" fill="none" stroke="#7000ff" stroke-width="1.2" opacity="0">
      <animate attributeName="r" values="0;125" dur="3.5s" begin="1.75s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="3.5s" begin="1.75s" repeatCount="indefinite"/>
    </circle>

    <!-- Rotating Sweep Beam -->
    <g>
      <line x1="0" y1="0" x2="0" y2="-125" stroke="#00f0ff" stroke-width="1.5" opacity="0.7" filter="url(#softGlow)"/>
      <path d="M 0 0 L 42 -117 A 125 125 0 0 0 0 -125 Z" fill="#00f0ff" opacity="0.12"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Scanline Beam (Sweeping Down) -->
  <rect x="0" y="0" width="1000" height="3" fill="url(#cyanPurpleLine)" opacity="0.7" filter="url(#neonGlow)">
    <animate attributeName="y" values="-5;360;-5" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Sci-Fi HUD Corner Brackets -->
  <g stroke="#00f0ff" stroke-width="2" fill="none" filter="url(#softGlow)">
    <path d="M 30,60 L 30,30 L 70,30"/>
    <circle cx="30" cy="30" r="3" fill="#00f0ff"/>
    <path d="M 970,60 L 970,30 L 930,30"/>
    <circle cx="970" cy="30" r="3" fill="#00f0ff"/>
    <path d="M 30,300 L 30,330 L 70,330"/>
    <circle cx="30" cy="330" r="3" fill="#00f0ff"/>
    <path d="M 970,300 L 970,330 L 930,330"/>
    <circle cx="970" cy="330" r="3" fill="#00f0ff"/>
  </g>

  <!-- Top Status Bar -->
  <line x1="40" y1="45" x2="960" y2="45" stroke="url(#cyanPurpleLine)" stroke-width="1"/>
  <text x="50" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff" letter-spacing="2" opacity="0.8">SYS.NEXUS :: SECURITY RESEARCH MATRIX</text>
  
  <g transform="translate(770, 36)">
    <circle cx="0" cy="-3" r="4" fill="#00ff9d" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="0" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00ff9d" letter-spacing="1">STATUS: OPERATIONAL</text>
  </g>

  <!-- DYNAMIC RGB GLITCH TITLE (Restored High-Tech Glitch Effect) -->
  <g transform="translate(500, 138)">
    <!-- Red/Pink Glitch Layer -->
    <text x="2" y="2" text-anchor="middle" font-family="'Orbitron', 'Fira Code', monospace, sans-serif" font-size="44" font-weight="900" fill="#ff0055" letter-spacing="6" opacity="0.8">
      <animate attributeName="x" values="2;-3;4;2;-2;3" dur="0.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0;0.9;0;0.5" dur="0.35s" repeatCount="indefinite"/>
      LOGESHWARAN S
    </text>

    <!-- Cyan Glitch Layer -->
    <text x="-2" y="-2" text-anchor="middle" font-family="'Orbitron', 'Fira Code', monospace, sans-serif" font-size="44" font-weight="900" fill="#00f0ff" letter-spacing="6" opacity="0.8">
      <animate attributeName="x" values="-2;3;-3;-2;2;-4" dur="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0;0.6;0;0.9" dur="0.45s" repeatCount="indefinite"/>
      LOGESHWARAN S
    </text>

    <!-- Main White Glowing Center Title -->
    <text x="0" y="0" text-anchor="middle" font-family="'Orbitron', 'Fira Code', monospace, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="6" filter="url(#neonGlow)">
      LOGESHWARAN S
    </text>
  </g>

  <!-- ALIAS / TITLE BADGE PILL -->
  <g transform="translate(500, 185)">
    <rect x="-240" y="-14" width="480" height="28" rx="14" fill="#091026" stroke="#00f0ff" stroke-width="1" opacity="0.95" filter="url(#softGlow)"/>
    <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#00f0ff" letter-spacing="2">
      🛡️ SECURITY ANALYST · RED &amp; BLUE TEAM · VAPT
    </text>
  </g>

  <!-- FOCUS AREAS PILLS -->
  <g transform="translate(500, 238)">
    <g transform="translate(-230, 0)">
      <rect x="0" y="-13" width="145" height="26" rx="6" fill="#0d1b3a" stroke="#00ff9d" stroke-width="0.8"/>
      <text x="72.5" y="4" text-anchor="middle" font-family="'JetBrains Mono', sans-serif" font-size="10" font-weight="bold" fill="#00ff9d">🛡️ SOC &amp; Blue Team</text>
    </g>
    <g transform="translate(-70, 0)">
      <rect x="0" y="-13" width="145" height="26" rx="6" fill="#0d1b3a" stroke="#7000ff" stroke-width="0.8"/>
      <text x="72.5" y="4" text-anchor="middle" font-family="'JetBrains Mono', sans-serif" font-size="10" font-weight="bold" fill="#b066ff">⚔️ VAPT &amp; Red Team</text>
    </g>
    <g transform="translate(90, 0)">
      <rect x="0" y="-13" width="145" height="26" rx="6" fill="#0d1b3a" stroke="#00f0ff" stroke-width="0.8"/>
      <text x="72.5" y="4" text-anchor="middle" font-family="'JetBrains Mono', sans-serif" font-size="10" font-weight="bold" fill="#00f0ff">🔍 Vulnerability Res.</text>
    </g>
  </g>

  <!-- Bottom Terminal Command Bar -->
  <g transform="translate(0, 305)">
    <line x1="40" y1="0" x2="960" y2="0" stroke="url(#cyanPurpleLine)" stroke-width="1"/>
    
    <text x="50" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00ff9d">loki@sec-ops:~$</text>
    <text x="175" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">./init_defense.sh --target="sec-research" --mode="active"</text>

    <!-- Blinking Cursor -->
    <rect x="730" y="9" width="8" height="14" fill="#00f0ff" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>

    <text x="820" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7000ff" letter-spacing="1">[ENCRYPTION: AES-256]</text>
  </g>
</svg>
