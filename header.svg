<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" style="background:#030712; border-radius:12px;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="40%" stop-color="#0b1329"/>
      <stop offset="70%" stop-color="#110d29"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Neon Lines Gradient -->
    <linearGradient id="cyanPurpleLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#7000ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="360" rx="12" fill="url(#bgGrad)"/>

  <!-- Background Grid Lines -->
  <g opacity="0.05" stroke="#00f0ff" stroke-width="0.5">
    <line x1="0" y1="40" x2="1000" y2="40"/>
    <line x1="0" y1="90" x2="1000" y2="90"/>
    <line x1="0" y1="140" x2="1000" y2="140"/>
    <line x1="0" y1="190" x2="1000" y2="190"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="0" y1="290" x2="1000" y2="290"/>

    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="350" y1="0" x2="350" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
    <line x1="650" y1="0" x2="650" y2="360"/>
    <line x1="850" y1="0" x2="850" y2="360"/>
  </g>

  <!-- Low Opacity Radar Graphic (Centered behind text with subtle glow) -->
  <g transform="translate(500, 140)" opacity="0.12">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#00f0ff" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#7000ff" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#00f0ff" stroke-width="0.5"/>

    <circle cx="0" cy="0" r="0" fill="none" stroke="#00f0ff" stroke-width="1">
      <animate attributeName="r" values="0;110" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="4s" repeatCount="indefinite"/>
    </circle>

    <g>
      <line x1="0" y1="0" x2="0" y2="-110" stroke="#00f0ff" stroke-width="1"/>
      <path d="M 0 0 L 35 -104 A 110 110 0 0 0 0 -110 Z" fill="#00f0ff" opacity="0.15"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Scanline Beam (Sweeping Down) -->
  <rect x="0" y="0" width="1000" height="2" fill="url(#cyanPurpleLine)" opacity="0.6" filter="url(#neonGlow)">
    <animate attributeName="y" values="-5;360;-5" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Sci-Fi HUD Corner Brackets -->
  <g stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 30,55 L 30,25 L 65,25"/>
    <circle cx="30" cy="25" r="3" fill="#00f0ff"/>
    <path d="M 970,55 L 970,25 L 935,25"/>
    <circle cx="970" cy="25" r="3" fill="#00f0ff"/>
    <path d="M 30,305 L 30,335 L 65,335"/>
    <circle cx="30" cy="335" r="3" fill="#00f0ff"/>
    <path d="M 970,305 L 970,335 L 935,335"/>
    <circle cx="970" cy="335" r="3" fill="#00f0ff"/>
  </g>

  <!-- Top Status Bar -->
  <line x1="40" y1="42" x2="960" y2="42" stroke="url(#cyanPurpleLine)" stroke-width="1"/>
  <text x="50" y="34" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff" letter-spacing="2" opacity="0.8">SYS.NEXUS :: SECURITY RESEARCH MATRIX</text>
  
  <g transform="translate(770, 34)">
    <circle cx="0" cy="-3" r="3.5" fill="#00ff9d" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="0" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00ff9d" letter-spacing="1">STATUS: OPERATIONAL</text>
  </g>

  <!-- MAIN TITLE (Clean, Crisp Neon Title with No Text Overlap) -->
  <g transform="translate(500, 115)">
    <!-- Soft Background Cyan Glow -->
    <text x="0" y="0" text-anchor="middle" font-family="'Orbitron', 'Fira Code', monospace, sans-serif" font-size="42" font-weight="900" fill="#00f0ff" letter-spacing="6" opacity="0.25" filter="url(#neonGlow)">
      LOGESHWARAN S
    </text>

    <!-- Main Crisp White/Cyan Title -->
    <text x="0" y="0" text-anchor="middle" font-family="'Orbitron', 'Fira Code', monospace, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="6" filter="url(#softGlow)">
      LOGESHWARAN S
    </text>
  </g>

  <!-- ALIAS / TITLE BADGE PILL (Positioned safely at Y=170) -->
  <g transform="translate(500, 168)">
    <rect x="-240" y="-14" width="480" height="28" rx="14" fill="#091026" stroke="#00f0ff" stroke-width="1" opacity="0.95" filter="url(#softGlow)"/>
    <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#00f0ff" letter-spacing="2">
      🛡️ SECURITY ANALYST · RED &amp; BLUE TEAM · VAPT
    </text>
  </g>

  <!-- FOCUS AREAS PILLS (Positioned safely at Y=225) -->
  <g transform="translate(500, 225)">
    <g transform="translate(-230, 0)">
      <rect x="0" y="-13" width="145" height="26" rx="6" fill="#0d1b3a" stroke="#00ff9d" stroke-width="0.8"/>
      <text x="72.5" y="4" text-anchor="middle" font-family="'JetBrains Mono', sans-serif" font-size="10" font-weight="bold" fill="#00ff9d">🛡️ SOC &amp; Blue Team</text>
    </g>
    <g transform="translate(-70, 0)">
      <rect x="0" y="-13" width="145" height="26" rx="6" fill="#0d1b3a" stroke="#7000ff" stroke-width="0.8"/>
      <text x="72.5" y="4" text-anchor="middle" font-family="'JetBrains Mono', sans-serif" font-size="10" font-weight="bold" fill="#b066ff">⚔️ VAPT &amp; Red Team</text>
    </g>
    <g transform="translate(90, 0)">
      <rect x="0" y="-13" width="145" height="26" rx="6" fill="#0d1b3a" stroke="#00f0ff" stroke-width="0.8"/>
      <text x="72.5" y="4" text-anchor="middle" font-family="'JetBrains Mono', sans-serif" font-size="10" font-weight="bold" fill="#00f0ff">🔍 Vulnerability Res.</text>
    </g>
  </g>

  <!-- Bottom Terminal Command Bar (Positioned safely at Y=290 to Y=325) -->
  <g transform="translate(0, 290)">
    <line x1="40" y1="0" x2="960" y2="0" stroke="url(#cyanPurpleLine)" stroke-width="1"/>
    
    <text x="50" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00ff9d">loki@sec-ops:~$</text>
    <text x="175" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">./init_defense.sh --target="sec-research" --mode="active"</text>

    <!-- Blinking Cursor -->
    <rect x="730" y="13" width="8" height="14" fill="#00f0ff" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>

    <text x="820" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7000ff" letter-spacing="1">[ENCRYPTION: AES-256]</text>
  </g>
</svg>
