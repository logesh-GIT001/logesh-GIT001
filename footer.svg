<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" style="background:#030712; border-radius:10px;">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070c1a"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <linearGradient id="glowLineFooter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowF" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="220" rx="10" fill="url(#footerBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Matrix Binary Rain Code Streams -->
  <g font-family="'JetBrains Mono', monospace" font-size="9" fill="#00f0ff" opacity="0.08">
    <text x="30" y="30">01001000 01100001 01100011 01101011 00100000 01110100 01101000 01100101 00100000 01110000 01101100 01100001 01101110 01100101 01110100</text>
    <text x="30" y="50">01010011 01000101 01000011 01010101 01010010 01001001 01010100 01011001 00100000 01000001 01001110 01000001 01001100 01011001 01010011 01010100</text>
    <text x="30" y="70">01001100 01001111 01000111 01000101 01010011 01001000 01010111 01000001 01000010 01000001 01001110 00100000 01010011 00100000 00110000 00110001</text>
    
    <text x="550" y="30">01001110 01010110 01001001 01000100 01001001 01000001 00100000 01010000 01010011 01001001 01000010 01010100 00100000 01010110 01010010 01000000</text>
    <text x="550" y="50">01000111 01001111 01001111 01000111 01001100 01000101 00100000 01000001 01001110 01000100 01010010 01001111 01001001 01000100 00100000 01010110 01010010 01000000</text>
    <text x="550" y="70">01000011 01000101 01000010 01010100 00101101 01001001 01010011 00100000 01001001 01001110 01000100 01010011 01000001 00100000 00110010 00110000 00110010 00110110</text>
  </g>

  <!-- Glowing Line Separator -->
  <line x1="40" y1="90" x2="960" y2="90" stroke="url(#glowLineFooter)" stroke-width="1.5" filter="url(#glowF)"/>

  <!-- Main Quote Card -->
  <g transform="translate(500, 135)" font-family="'JetBrains Mono', monospace">
    <text x="0" y="0" text-anchor="middle" font-size="15" font-weight="bold" fill="#00ff9d" filter="url(#glowF)">
      "The quieter you become, the more you can hear."
    </text>
    <text x="0" y="24" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">
      — Kali Linux Motto &amp; Offensive Security Axiom
    </text>
  </g>

  <!-- Status Bar Footer -->
  <g transform="translate(0, 195)" font-family="'JetBrains Mono', monospace" font-size="10">
    <line x1="40" y1="0" x2="960" y2="0" stroke="#1e293b" stroke-width="1"/>

    <circle cx="50" cy="12" r="3.5" fill="#00ff9d" filter="url(#glowF)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="60" y="15" fill="#00ff9d" font-weight="bold">SYSTEM STATUS: ONLINE</text>

    <text x="500" y="15" text-anchor="middle" fill="#94a3b8">© 2026 LOGESHWARAN S (LOKI) · ALL RIGHTS RESERVED</text>

    <text x="950" y="15" text-anchor="end" fill="#00f0ff" font-weight="bold">[ENCRYPTED &amp; SIGNED]</text>
  </g>
</svg>
